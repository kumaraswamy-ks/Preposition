<script>

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),shuffle=a=>[...a].sort(()=>Math.random()-.5),today=()=>new Date().toLocaleDateString('en-CA'),storeKey='ks-preposition-v1';
const initial=()=>({completed:[],attempts:0,correct:0,mistakes:{},scores:[],known:[],review:[],bookmarks:[],worksheets:0,daily:'',dark:false,kannada:false,history:[]});let state;try{state={...initial(),...JSON.parse(localStorage.getItem(storeKey)||'{}')}}catch{state=initial()}const save=()=>{try{localStorage.setItem(storeKey,JSON.stringify(state))}catch{}},notice=s=>{const t=$('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(notice.timer);notice.timer=setTimeout(()=>t.classList.add('hidden'),2600)};
const lessonData=[
['What is a preposition?','Foundations','A preposition links a noun, pronoun or noun phrase to another part of a sentence. It tells us where, when, how or why.','Preposition ಎಂಬುದು ನಾಮಪದ ಅಥವಾ ಸರ್ವನಾಮಕ್ಕೆ ವಾಕ್ಯದ ಇತರ ಪದಗಳೊಂದಿಗೆ ಇರುವ ಸಂಬಂಧವನ್ನು ತೋರಿಸುತ್ತದೆ.','The book is on the table.|She is in the classroom.|He came from Bengaluru.','Ask: what relationship does the small word show?'],
['Basic prepositions','Foundations','Common prepositions include in, on, at, by, with, from, to, for, of and about. The word after the preposition is usually its object.','in = ಒಳಗೆ; on = ಮೇಲೆ; at = ನಿರ್ದಿಷ್ಟ ಸ್ಥಳದಲ್ಲಿ; from = ಇಂದ; to = ಕಡೆಗೆ.','We waited for two hours.|The keys are on the desk.|She spoke with her friend.','Read the whole phrase, not just one word.'],
['Types of prepositions','Foundations','Prepositions can express place, time, direction, movement, cause, manner, possession, source and relationship. One word can serve more than one role.','ಒಂದೇ ಪದವು ಸಂದರ್ಭಕ್ಕೆ ಅನುಗುಣವಾಗಿ ಸ್ಥಳ, ಸಮಯ ಅಥವಾ ದಿಕ್ಕನ್ನು ಸೂಚಿಸಬಹುದು.','Meet me at noon.|Meet me at the gate.|She walked to the gate.','Use context to decide the type.'],
['Place: in, on, at','Place','Use in for an enclosed area, on for a surface, and at for a particular point or location.','in = ಒಳಗೆ; on = ಮೇಲ್ಮೈ ಮೇಲೆ; at = ನಿರ್ದಿಷ್ಟ ಸ್ಥಳದಲ್ಲಿ.','The chalk is in the box.|The chart is on the wall.|Meet me at the station.','IN = area · ON = surface · AT = point.'],
['Time: in, on, at','Time','Use at for precise times, on for days and dates, and in for months, years, seasons and longer periods.','at = ನಿಖರ ಸಮಯ; on = ದಿನ/ದಿನಾಂಕ; in = ತಿಂಗಳು/ವರ್ಷ.','The class begins at 9 a.m.|We meet on Friday.|School reopens in June.','AT → clock · ON → calendar day · IN → calendar period.'],
['Direction and movement','Movement','Use to for a destination, towards for direction, into for movement inside, onto for movement to a surface, through for enclosed passage and across for crossing.','to = ಕಡೆಗೆ; into = ಒಳಗೆ ಹೋಗುವುದು; across = ಒಂದು ಬದಿಯಿಂದ ಇನ್ನೊಂದು ಬದಿಗೆ.','She went to school.|The cat ran into the room.|They walked across the bridge.','Compare location (in/on) with movement (into/onto).'],
['Position and proximity','Place','Above means higher without necessarily touching; over often suggests covering or crossing. Below and under describe lower positions. Beside means next to.','above = ಮೇಲ್ಭಾಗದಲ್ಲಿ; under = ಕೆಳಗೆ; beside = ಪಕ್ಕದಲ್ಲಿ.','The lamp hangs above the desk.|The shoes are under the bed.|Sit beside me.','Besides means “in addition to”, not “next to”.'],
['Agent and instrument','Usage','In passive sentences, by names the doer. With names the tool or instrument used.','by = ಕೆಲಸ ಮಾಡಿದ ವ್ಯಕ್ತಿ; with = ಬಳಸಿದ ಸಾಧನ.','The poem was written by Meera.|The letter was opened with a key.','Ask who did it (by) or what was used (with).'],
['Cause, manner and measure','Usage','Because of and due to introduce a reason. With can describe manner. By and per can express units or rates.','because of = ಕಾರಣದಿಂದ; with = ರೀತಿಯಲ್ಲಿ; per = ಪ್ರತಿ.','The match stopped because of rain.|She answered with confidence.|Rice is sold by the kilogram.','A prepositional phrase can explain why, how or how much.'],
['Possession, source and relation','Usage','Of often connects a part to a whole or shows association. From identifies a source. About and regarding introduce a subject.','of = ಸಂಬಂಧ; from = ಮೂಲ; about = ವಿಷಯದ ಬಗ್ಗೆ.','The cover of the book is blue.|The parcel came from Mysuru.|We talked about science.','Match the relationship to the meaning.'],
['Between and among','Comparisons','Use between for distinct people or things (even more than two when treated individually); use among for members considered as a group.','between = ಪ್ರತ್ಯೇಕ ವ್ಯಕ್ತಿ/ವಸ್ತುಗಳ ನಡುವೆ; among = ಗುಂಪಿನಲ್ಲಿ.','The bank is between the school and the clinic.|She stood among her classmates.|Negotiations between the three teams continued.','“Between” is not restricted to exactly two in modern English.'],
['Beside and besides','Comparisons','Beside means next to. Besides means in addition to or apart from.','beside = ಪಕ್ಕದಲ್ಲಿ; besides = ಇದರ ಜೊತೆಗೆ.','The chair is beside the window.|Besides Kannada, she speaks English.','The final s changes the meaning.'],
['Since, for and from','Comparisons','Since names a starting point continuing to a reference time; for names a duration; from marks a starting point and commonly pairs with to.','since = ಆರಂಭವಾದ ಸಮಯ; for = ಅವಧಿ; from = ಪ್ರಾರಂಭದ ಬಿಂದು.','I have lived here since 2021.|I have lived here for five years.|The office opens from Monday to Friday.','SINCE → starting point · FOR → length of time.'],
['By and until','Comparisons','By sets a deadline: no later than that time. Until means an action or state continues up to that time.','by = ಅಷ್ಟರೊಳಗೆ; until = ಅಲ್ಲಿಯವರೆಗೆ ಮುಂದುವರಿಯುವುದು.','Submit the form by Friday.|Stay here until Friday.','A deadline ends an opportunity; a continuing action lasts until a point.'],
['To and for','Comparisons','To often marks destination or recipient. For often marks purpose, benefit or intended recipient.','to = ಗಮ್ಯಸ್ಥಾನ/ಸ್ವೀಕರಿಸುವವರು; for = ಉದ್ದೇಶ/ಪ್ರಯೋಜನ.','She went to the library.|She gave the book to Ravi.|She bought a book for Ravi.','Give something TO someone; buy something FOR someone.'],
['In and into / on and onto','Comparisons','In and on describe position. Into and onto describe a change of position or movement to an interior or surface.','in/on = ಇರುವ ಸ್ಥಳ; into/onto = ಆ ಸ್ಥಳಕ್ಕೆ ಚಲನೆ.','The children are in the room.|They ran into the room.|The cat is on the table.|It jumped onto the table.','State versus movement is the key.'],
['Preposition + pronoun','Grammar','After a preposition use an object pronoun: me, him, her, us or them; not I, he, she, we or they.','Preposition ನಂತರ me, him, her, us, them ಮುಂತಾದ object pronoun ಬಳಸಿ.','Come with me.|This letter is for her.|They sat near us.','“Between you and me” is standard, not “between you and I”.'],
['Preposition + gerund','Grammar','When a verb follows a preposition, use its -ing form as a gerund.','Preposition ನಂತರ ಕ್ರಿಯಾಪದ ಬಂದರೆ ಸಾಮಾನ್ಯವಾಗಿ -ing ರೂಪ ಬಳಸಿ.','She is interested in learning.|He left without saying goodbye.|They succeeded by working hard.','After “look forward to”, use -ing: looking forward to meeting.'],
['Simple, compound and phrase forms','Grammar','Simple prepositions are single words (in, on). Compound forms include into and within. Phrase prepositions contain several words, such as in front of or because of.','ಒಂದು ಪದ: in; ಸಂಯುಕ್ತ ಪದ: into; ಹಲವು ಪದಗಳ ಗುಂಪು: in front of.','The shop is near school.|She sat in front of the class.|The train was late because of fog.','Treat phrase prepositions as one unit of meaning.'],
['Prepositional phrases','Grammar','A prepositional phrase contains a preposition, its object and any modifiers: “under the old bridge”. It can add details to a noun or verb.','Prepositional phrase ನಲ್ಲಿ preposition ಮತ್ತು ಅದರ ನಂತರದ ನಾಮಪದ/ಸರ್ವನಾಮ ಇರುತ್ತದೆ.','The dog slept under the wooden table.|The student with the red bag is my friend.','Identify the whole phrase, not just the preposition.'],
['Verb, adjective and noun collocations','Collocations','Some words commonly select a particular preposition. Learn them as pairs rather than translating word by word.','ಕೆಲವು ಪದಗಳೊಂದಿಗೆ ನಿರ್ದಿಷ್ಟ preposition ಬರುತ್ತದೆ; ಅವುಗಳನ್ನು ಜೊತೆಯಾಗಿ ಕಲಿಯಿರಿ.','Listen to the teacher.|She is good at mathematics.|There is a need for change.','Common pairs: depend on, interested in, afraid of, reason for.'],
['Preposition vs adverb','Advanced','A preposition typically has an object. An adverb can stand alone. The same word can work in both ways.','Preposition ನಂತರ object ಇರುತ್ತದೆ; adverb ಸ್ವತಂತ್ರವಾಗಿ ನಿಲ್ಲಬಹುದು.','She walked inside the house. (preposition)|She walked inside. (adverb)','Look for an object after the word.'],
['Preposition vs conjunction / particle','Advanced','A preposition takes a noun phrase or gerund; a conjunction introduces a clause. A particle forms part of a phrasal verb.','Conjunction ನಂತರ ಪೂರ್ಣ clause ಬರುತ್ತದೆ; particle phrasal verb ನ ಭಾಗವಾಗಿದೆ.','We left after lunch. (preposition)|We left after the bell rang. (conjunction)|Please turn off the light. (particle)','Compare “before dinner” with “before we ate”.'],
['Common errors and sentence correction','Advanced','Avoid extra prepositions after certain verbs; use the standard collocation and choose the correct object form. Sentence-final prepositions are often natural English.','ಕೆಲವು ಕ್ರಿಯಾಪದಗಳ ನಂತರ ಅನಗತ್ಯ preposition ಬಳಸದಿರಿ; ಸರಿಯಾದ ಪದಜೋಡಿ ಬಳಸಿ.','Discuss the plan. (not discuss about)|He is good at English. (not good in)|Who are you talking to? (natural)','Correct the relationship, not only the individual word.'],
['Competitive grammar strategies','Exam preparation','Read the complete sentence before choosing. Check meaning, time reference, collocation, object form and whether a word introduces a clause.','ಪೂರ್ಣ ವಾಕ್ಯ ಓದಿ; ಅರ್ಥ, ಸಮಯ, collocation ಮತ್ತು ನಂತರದ ಪದವನ್ನು ಪರಿಶೀಲಿಸಿ.','She insisted on paying the bill.|Despite the rain, they played.|We arrived at the station on time.','Eliminate choices by meaning, not by memorising isolated pairs.']
];

eet.className)||'____________'} &nbsp; Date: ${esc(worksheet.date)||'__________'}</p><p class="small">School: ${esc(worksheet.school)||'________________________'} &nbsp; Marks: ${worksheet.set.length} &nbsp; Time: ${Math.ceil(worksheet.set.length*1.5)} minutes</p><p class="small muted">Choose the best answer for each question. Each question carries one mark.</p></div>${worksheet.set.map((q,i)=>`<div class="paperitem"><p><b>${i+1}.</b> ${esc(q.stem)}</p><small>${q.options.map((o,j)=>`${'ABCD'[j]}. ${esc(o)}`).join(' &nbsp; · &nbsp; ')}</small></div>`).join('')}${worksheet.key?`<div style="break-before:page"><h2>Answer key & explanations</h2>${worksheet.set.map((q,i)=>`<p class="paperitem"><b>${i+1}. ${esc(q.answer)}</b> — ${esc(q.explanation)}</p>`).join('')}</div>`:''}</div>`:''}`}
function mistakes(){let items=Object.entries(state.mistakes).map(([id,v])=>({q:bank[+id],...v})).filter(v=>v.q);return head('My mistake book','The questions you missed stay here until you master or remove them.','SMART REVISION')+`<div class="row" style="margin:23px 0"><button class="btn primary" data-action="revision" ${items.length?'':'disabled'}>Revise my weak areas →</button><span class="pill">${items.length} to revisit</span></div>${items.length?`<div class="lesson-list">${items.map(v=>`<div class="card"><span class="tag">${esc(v.q.topic)}</span><h3>${esc(v.q.stem)}</h3><p>Your answer: <b>${esc(v.chosen)}</b> · Correct: <b>${esc(v.q.answer)}</b><br>${esc(v.q.explanation)}</p><div class="cardbottom"><small>Missed ${v.count} time${v.count===1?'':'s'} · ${esc(v.date)}</small><button class="btn" data-remove="${v.q.id}">Remove ✓</button></div></div>`).join('')}</div>`:'<div class="empty">No mistakes saved yet. Practise a few questions to start your personal revision list.</div>'}`}
function progress(){let pct=state.attempts?Math.round(state.correct/state.attempts*100):0,counts={};state.history.forEach(x=>{let t=counts[x.topic]??={correct:0,total:0};t.total++;if(x.ok)t.correct++});let achievements=[['First lesson',state.completed.length>0],['50 questions',state.attempts>=50],['100 questions',state.attempts>=100],['90% accuracy',state.attempts>=20&&pct>=90],['Preposition explorer',state.completed.length>=10],['Collocation master',(counts.Collocations?.correct||0)>=15],['Error spotter',(counts.Correction?.correct||0)>=10],['Competitive learner',state.scores.some(x=>x.label.includes('Competitive'))],['Preposition master',state.completed.length===lessonData.length&&state.scores.some(x=>x.label.includes('Grand')&&x.score/x.total>=.8)]];return head('Your learning story','Your work is saved privately in this browser, even when you open this page offline.','PROGRESS DASHBOARD')+`<div class="statgrid"><div class="stat"><strong>${state.completed.length}/${lessonData.length}</strong><span>LESSONS</span></div><div class="stat"><strong>${state.attempts}</strong><span>ATTEMPTED</span></div><div class="stat"><strong>${pct}%</strong><span>ACCURACY</span></div><div class="stat"><strong>${state.worksheets}</strong><span>SHEETS MADE</span></div></div><div class="sectionhead"><h2>Topic performance</h2></div><div class="card">${Object.keys(counts).length?Object.entries(counts).sort((a,b)=>a[1].correct/a[1].total-b[1].correct/b[1].total).map(([k,v])=>`<div class="barrow"><span>${esc(k)}</span><div class="progressline"><span style="width:${Math.round(v.correct/v.total*100)}%"></span></div><b>${Math.round(v.correct/v.total*100)}%</b></div>`).join(''):'<p>Answer a few questions to see your strengths and weak areas.</p>'}</div><div class="sectionhead"><h2>Achievements</h2></div><div class="card">${achievements.map(([x,unlocked])=>`<span class="badge" style="opacity:${unlocked?1:.4}">${unlocked?'★':'☆'} ${x}</span>`).join('')}</div><div class="grid two" style="margin-top:18px"><div class="card"><h3>Recent tests</h3>${state.scores.length?state.scores.slice(-6).reverse().map(s=>`<p>${esc(s.label)} · <b>${s.score}/${s.total}</b> · ${esc(s.date)}</p>`).join(''):'<p>No tests taken yet.</p>'}</div><div class="card"><h3>Saved & learned</h3><p>${state.known.length} flashcards known · ${state.bookmarks.length} bookmarks · ${Object.keys(state.mistakes).length} questions to revise</p><button class="btn" data-action="revision">Start revision →</button></div></div><div class="sectionhead"><h2>Privacy & reset</h2></div><p class="muted small">Progress stays on this device. Clearing browser data will remove it. The downloaded HTML includes the learning content, not your saved progress.</p><button class="btn" data-action="reset">Reset my progress</button>`}
function render(){document.documentElement.classList.toggle('dark',state.dark);$('#nav').innerHTML=nav.map(([id,icon,text])=>`<button class="${page===id?'active':''}" data-go="${id}" ${page===id?'aria-current="page"':''}><span class="ico">${icon}</span>${text}</button>`).join('');$('#crumb').textContent=nav.find(x=>x[0]===page)?.[2]||'Overview';$('#theme').textContent=state.dark?'☀':'◐';$('#language').textContent=state.kannada?'English':'ಕನ್ನಡ';let html=page==='home'?home():page==='learn'?lessons():page==='practice'?(practice?questionView():quiz?results():picker()):page==='quiz'?(practice?questionView():quiz?results():quizPicker()):page==='flashcards'?flashcards():page==='reference'?reference():page==='worksheets'?worksheetPage():page==='mistakes'?mistakes():progress();$('#content').innerHTML=html+footer()}
function record(q,chosen){let ok=chosen===q.answer;state.attempts++;if(ok)state.correct++;state.history.push({topic:q.topic,ok});if(state.history.length>1000)state.history=state.history.slice(-1000);if(!ok){let v=state.mistakes[q.id]||{count:0};state.mistakes[q.id]={count:v.count+1,chosen,date:today()}}else if(state.mistakes[q.id])delete state.mistakes[q.id];save();return ok}
function finish(){const p=practice;p.end=Date.now();if(p.mode==='test'||p.mode==='daily')state.scores.push({label:p.label,score:p.score,total:p.set.length,date:today()});if(p.mode==='daily')state.daily=today();save();quiz=p;practice=null;render()}
function speak(text){if(!('speechSynthesis'in window)){notice('Speech is unavailable in this browser.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-IN';u.rate=.85;speechSynthesis.speak(u)}
document.addEventListener('click',e=>{let el=e.target.closest('[data-go],[data-lesson],[data-action],[data-topic],[data-test],[data-answer],[data-complete],[data-bookmark],[data-remove],[data-speak],[data-kind],[data-cloze],[data-refpage],[data-refword]');if(!el)return;if(el.dataset.go){navTo(el.dataset.go);return}if(el.dataset.lesson!==undefined){lessonIndex=Number(el.dataset.lesson);page='learn';render();window.scrollTo(0,0);return}if(el.dataset.speak){speak(el.dataset.speak);return}if(el.dataset.bookmark){let key=el.dataset.bookmark;state.bookmarks=state.bookmarks.includes(key)?state.bookmarks.filter(x=>x!==key):[...state.bookmarks,key];save();render();return}if(el.dataset.complete!==undefined){let i=Number(el.dataset.complete);if(!state.completed.includes(i))state.completed.push(i);save();render();notice('Lesson completed!');return}if(el.dataset.remove!==undefined){delete state.mistakes[el.dataset.remove];save();render();return}if(el.dataset.kind){let kind=el.dataset.kind;startPractice(bank.filter(x=>x.kind===kind),kind==='cloze'?15:10,kind==='cloze'?'Mixed cloze practice':kind);return}if(el.dataset.cloze!==undefined){let i=Number(el.dataset.cloze);startPractice(clozeQuestions.filter(x=>x.passage===i),3,'Cloze passage '+(i+1));return}if(el.dataset.refpage){refOffset+=el.dataset.refpage==='next'?25:-25;refOffset=Math.max(0,refOffset);render();window.scrollTo(0,0);return}if(el.dataset.refword){refQuery=el.dataset.refword;refOffset=0;render();$('#refsearch')?.scrollIntoView();return}if(el.dataset.topic){let topic=el.dataset.topic;startPractice(bank.filter(x=>x.topic===topic),10,topic);return}if(el.dataset.test){let name=el.dataset.test,n=name.includes('Quick')?10:name.includes('Standard')?25: name.includes('Advanced')?50:100,pool=name.includes('Grand')?['fill','identify','collocation','error','correction','translation','cloze'].flatMap((kind,i)=>shuffle(bank.filter(x=>x.kind===kind)).slice(0,[20,10,20,15,15,10,10][i])):name.includes('Advanced')?bank.filter(x=>x.level>=3):name.includes('Competitive')?bank.filter(x=>x.level>=3):bank;startPractice(pool,n,name,'test');return}if(el.dataset.answer!==undefined){if(!practice||practice.answered!==null)return;let q=practice.set[practice.index],chosen=q.options[Number(el.dataset.answer)];practice.answered=chosen;let ok=record(q,chosen);if(ok)practice.score++;practice.results.push({q,ok});render();return}let action=el.dataset.action;if(!action)return;if(action==='kannada'){$('#language').click();return}if(action==='startpractice'){let topic=$('#ptopic').value,level=Number($('#plevel').value),n=Number($('#pcount').value),pool=bank.filter(x=>(topic==='All topics'||x.topic===topic)&&(!level||x.level===level));startPractice(pool,n,topic==='All topics'?'Mixed practice':topic);return}if(action==='revision'){let pool=Object.keys(state.mistakes).map(id=>bank[+id]).filter(Boolean);if(!pool.length){notice('No missed questions yet. Try a practice set first.');return}startPractice(pool,Math.min(10,pool.length),'Smart revision');return}if(action==='quit'){practice=null;quiz=null;render();return}if(action==='next'){if(practice.index===practice.set.length-1)finish();else{practice.index++;practice.answered=null;render()}window.scrollTo(0,0);return}if(action==='flip'){flipped=!flipped;render();return}if(action==='nextcard'||action==='prevcard'){let count=bank.filter(q=>q.kind==='fill'||q.kind==='collocation').length;flashIndex=(flashIndex+(action==='nextcard'?1:-1)+count)%count;flipped=false;render();return}if(action==='knowncard'||action==='reviewcard'){let cards=bank.filter(q=>q.kind==='fill'||q.kind==='collocation'),id=cards[flashIndex%cards.length].id,key=action==='knowncard'?'known':'review';if(!state[key].includes(id))state[key].push(id);save();flashIndex=(flashIndex+1)%cards.length;flipped=false;render();return}if(action==='generate'){let topic=$('#wtopic').value,level=Number($('#wlevel').value),pool=bank.filter(q=>(topic==='All topics'||q.topic===topic)&&(!level||q.level===level));if(!pool.length){notice('No questions for this selection.');return}worksheet={type:$('#wtype').value,set:sample(pool,Number($('#wcount').value)).map(q=>({...q,options:shuffle([...new Set(q.options)].length>=4?[...new Set(q.options)].slice(0,4):[...new Set([...q.options,...["in","on","at","for","to","with","from","by"].filter(x=>x!==q.answer)])].slice(0,4))})),name:$('#wname').value,className:$('#wclass').value,school:$('#wschool').value,date:$('#wdate').value,key:false};state.worksheets++;save();render();$('#paper')?.scrollIntoView({behavior:'smooth'});return}if(action==='showkey'){worksheet.key=!worksheet.key;render();$('#paper')?.scrollIntoView();return}if(action==='printpaper'){window.print();return}if(action==='reset'){if(confirm('Reset all your saved progress, mistakes, bookmarks and test scores on this device?')){state=initial();save();render();notice('Progress reset.')}return}});
$('#download').onclick=()=>{const source=document.documentElement.cloneNode(true);source.querySelector('#nav').innerHTML='';source.querySelector('#content').innerHTML='';source.querySelector('#toast').textContent='';const blob=new Blob(['<!doctype html>\n'+source.outerHTML],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='KS-Preposition-Learning-Portal.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#theme').onclick=()=>{state.dark=!state.dark;save();render()};$('#language').onclick=()=>{state.kannada=!state.kannada;save();render()};document.addEventListener('input',e=>{if(e.target.id==='refsearch'){let pos=e.target.selectionStart;refQuery=e.target.value;refOffset=0;render();let input=$('#refsearch');input.focus();input.setSelectionRange(pos,pos)}});document.addEventListener('change',e=>{if(e.target.id==='reffilter'){refType=e.target.value;refOffset=0;render()}if(e.target.id==='reflevel'){refLevel=Number(e.target.value);refOffset=0;render()}});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&practice&&practice.answered!==null&&e.target.tagName!=='BUTTON'){$('[data-action="next"]')?.click()}});
// Daily challenge: five mixed questions including a collocation, correction, time/place and higher-level use.
document.addEventListener('click',e=>{let el=e.target.closest('[data-start="daily"]');if(!el||state.daily===today())return;let topics=['Collocations','Correction','Time','Place','Advanced'];let set=topics.map(t=>shuffle(bank.filter(q=>q.topic===t))[0]);startPractice(set,5,'Daily challenge','daily')});lessonIndex=-1;render();
})();
